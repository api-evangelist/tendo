aid: tendo
name: Tendo
description: >-
  Tendo is a healthcare software company founded in 2020 by siblings Dan and Jen
  Goldsmith (previously of Veeva Systems and Instructure) and headquartered in the
  Philadelphia area. Tendo builds a cloud, purpose-built healthcare platform and a
  suite of applications that connect patients, clinicians, providers, and caregivers
  across the care journey — spanning digital patient engagement, quality and clinical
  documentation improvement, hospital quality rankings analytics, and the Care Connect
  marketplace for employers, providers, and patients. The company raised a $50M Series
  B led by Lux Capital (with General Catalyst). Tendo runs public trust and status
  surfaces (a SafeBase trust center with SOC 2 and HIPAA, an Atlassian Statuspage) but
  does not publish a public developer portal or OpenAPI; API integration is delivered
  under private partner agreements. Surfaced as a Lux Capital portfolio company and
  enriched in the API Evangelist network.
